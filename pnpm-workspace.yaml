ignoreScripts: true
catalogMode: prefer
minimumReleaseAge: 5760 # 4 days in minutes
trustPolicy: no-downgrade
strictDepBuilds: true
blockExoticSubdeps: true

onlyBuiltDependencies:
  - esbuild
minimumReleaseAgeExclude:
  # Renovate security update: pnpm@11.8.0 || 11.11.0
  - pnpm@11.8.0 || 11.11.0

catalogs:
  runtime:
    "@actions/core": 3.0.1

  dev:
    oxfmt: 0.76.0
    oxlint: 1.91.0
    oxlint-tsgolint: 7.0.2005
    typescript: 7.0.2
    vite: 8.3.6

  types:
    "@types/node": 26.6.6
